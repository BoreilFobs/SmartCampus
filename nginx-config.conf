# Nginx configuration for SmartCampus - Upload limits
# Place this in /etc/nginx/conf.d/smartcampus.conf or include in your server block

server {
    listen 8080;
    server_name localhost;

    # Increase upload size limit to 500MB
    client_max_body_size 500M;

    # Other Nginx settings
    root /home/fobs/Desktop/Projects/SmartCampus/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Increase PHP timeouts
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
